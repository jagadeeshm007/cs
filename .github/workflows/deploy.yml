name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault
          fetch-depth: 0

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Quartz deps
        working-directory: quartz
        run: npm ci

      - name: Sync vault into Quartz content/
        run: |
          rm -rf quartz/content
          mkdir -p quartz/content
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.obsidian' \
            --exclude='node_modules' \
            --exclude='.trash' \
            --exclude='public' \
            --exclude='.quartz-cache' \
            vault/ quartz/content/

      - name: Install site config
        run: cp vault/.github/quartz/quartz.config.ts quartz/quartz.config.ts

      - name: Build site
        working-directory: quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
